services:
  deepseek-v4.1-flash:
    # Any vllm/vllm-openai:nightly from 2026-09-10 on serves DeepSeek-V4.1-Flash
    # (vllm-project/vllm#56228). The launch-day deepseekv41-flash-0909 tag is
    # deprecated by the official recipe and needs five extra patches.
    image: vllm/vllm-openai:nightly
    container_name: "vllm-deepseek-v4.1-flash"
    restart: unless-stopped

    ports:
      - "8001:8001"

    volumes:
      # Model + caches. Adjust HOST_CACHE to wherever you keep weights.
      - "${HF_HOME:-/root/.cache/huggingface}:/root/.cache/huggingface"
      - "${VLLM_CACHE:-/root/.cache/vllm}:/root/.cache/vllm"
      - "/tmp/deepseek-v4.1-flash:/tmp"
      # THE one patch this repo still ships. Bind-mount over site-packages.
      # Paths assume you cloned this repo to /opt/deepseek-v4.1-flash-gb300 —
      # change the left side to match your checkout.
      - "/opt/deepseek-v4.1-flash-gb300/patches/deep_gemm.py:/usr/local/lib/python3.12/dist-packages/vllm/utils/deep_gemm.py:ro"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # GB300 by UUID. On a box with a display GPU as well, "all"
              # loads the model onto the wrong card.
              device_ids: ['GPU-<your-gb300-uuid>']
              capabilities: [gpu]

    environment:
      - NVIDIA_VISIBLE_DEVICES=GPU-<your-gb300-uuid>
      - VLLM_ENGINE_READY_TIMEOUT_S=3600   # first load of ~500GB is slow
      - HF_TOKEN=${HF_TOKEN}               # deepseek-ai/DeepSeek-V4.1-Flash is gated
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

    command:
      - "--model"
      - "deepseek-ai/DeepSeek-V4.1-Flash"
      - "--tensor-parallel-size"
      - "1"
      - "--gpu-memory-utilization"
      - "0.9230"        # vLLM logs its own safe max; 0.95 OOMs during graph capture
      - "--max-model-len"
      - "1048576"
      - "--dtype"
      - "auto"
      - "--compilation-config"
      # dspark k=3: sizes must be multiples of decode_query_len=4 AND <=
      # max_num_seqs x 4, or vLLM silently DROPS them and those batches run eager.
      - '{"mode":"VLLM_COMPILE","cudagraph_capture_sizes":[4,8,12,16,20,24,28,32]}'
      - "--cpu-offload-gb"
      - "75"
      - "--enable-prefix-caching"
      - "--enable-chunked-prefill"
      - "--max-num-seqs"
      - "8"
      - "--max-num-batched-tokens"
      - "16384"         # 8k -> 16k: ~5x faster long-prompt prefill; costs ~1.7M KV tokens
      - "--trust-remote-code"
      - "--tool-call-parser"
      - "deepseek_v41"
      - "--enable-auto-tool-choice"
      - "--reasoning-parser"
      - "deepseek_v41"
      - "--linear-backend"
      - "auto"          # pure cute-dsl w/ the two FlashInfer patches above; use "marlin"
                        # instead if you skip those mounts
      - "--block-size"
      - "128"           # sparse_mla.py hardcodes 64 only for family(90); 64 => ValueError
      - "--tokenizer-mode"
      - "deepseek_v41"
      - "--speculative-config"
      - '{"method":"dspark","num_speculative_tokens":3,"draft_sample_method":"greedy"}'
      # k=3 greedy beats k=5 probabilistic on this model: 63% acceptance efficiency
      # (1.90 accepted/step vs 1.51) and 4-wide graphs fit every capture size.
      - "--served-model-name"
      - "deepseek-v4.1-flash"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8001"

    ipc: host
    init: true

    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1

    healthcheck:
      test: ["CMD", "curl", "f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s
